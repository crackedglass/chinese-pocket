<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chinese Pocket</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--ink:#18212b;--muted:#718096;--line:#e6ebf0;--paper:#f7f8fa;--accent:#d9513f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:18px 16px 92px}.top{display:flex;align-items:center;justify-content:flex-end;margin-bottom:18px}.user{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8edf2;display:grid;place-items:center;font-weight:800;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat strong{font-size:26px;display:block;letter-spacing:-.04em}.stat span{font-size:12px;color:var(--muted)}section{margin:24px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section-head h3{margin:0;font-size:18px}.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px}.word{display:flex;align-items:center;gap:14px}.hanzi{font-family:serif;font-size:32px;min-width:76px}.pinyin{font-weight:700}.translation{color:var(--muted);font-size:14px}.empty{text-align:center;color:var(--muted);padding:30px 10px}.form{display:grid;gap:10px}.form input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;background:#fff;outline:none}.form input:focus{border-color:var(--accent)}button.primary{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:13px;font:inherit;font-weight:800;cursor:pointer}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:42px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));z-index:5}.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;cursor:pointer}.tab.active{color:var(--accent)}.tab i{display:block;font-style:normal;font-size:21px;line-height:22px;margin-bottom:2px}.toast{position:fixed;left:18px;right:18px;bottom:84px;background:#23313b;color:#fff;border-radius:10px;padding:12px 15px;display:none;text-align:center}.hidden{display:none!important}@media(min-width:600px){main{padding-top:28px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><header class="top"><div class="user"><span id="name">Пользователь</span><div class="avatar" id="avatar">中</div></div></header><div class="stats"><div class="stat"><strong id="total">0</strong><span>слов</span></div><div class="stat"><strong id="streak">1</strong><span>день подряд</span></div></div><section id="dicts"><div class="section-head"><h3>Словарь</h3></div><div class="form"><select id="dict-select" onchange="selectDictionary()"></select><input id="dict-name" placeholder="Название общего словаря"><button class="primary" type="button" onclick="createDictionary()">Создать общий словарь</button><input id="invite-code-input" placeholder="Код приглашения"><button class="primary" type="button" onclick="redeemInvite()">Вступить по коду</button><div id="invite-code"></div><button class="link" id="invite-button" type="button" onclick="createInvite()">Создать приглашение</button><div id="member-list"></div></div></section><section id="channels"><div class="section-head"><h3>Каналы</h3></div><div class="form"><input id="channel-id" placeholder="ID канала · -100…" inputmode="numeric"><select id="channel-dictionary"></select><button class="primary" type="button" onclick="linkChannel()">Подключить канал</button></div><div id="channel-list"></div></section><section id="home"><div class="section-head"><h3>Повторить сегодня</h3><button class="link" onclick="loadReview()">Обновить</button></div><div id="review"></div></section><section id="add" class="hidden"><div class="section-head"><h3>Новое слово</h3></div><form class="form" onsubmit="addWord(event)"><input id="hanzi" placeholder="汉字 · иероглифы" required><input id="pinyin" placeholder="Pinyin · nǐ hǎo" required><input id="translation" placeholder="Перевод · привет" required><button class="primary">Добавить в словарь</button></form></section><section id="dictionary" class="hidden"><div class="section-head"><h3>Мой словарь</h3><span class="subtitle" id="count"></span></div><div id="words"></div></section></main><nav class="tabs"><button class="tab active" data-tab="home" onclick="showTab('home',this)"><i>⌂</i>Главная</button><button class="tab" data-tab="add" onclick="showTab('add',this)"><i>＋</i>Добавить</button><button class="tab" data-tab="dictionary" onclick="showTab('dictionary',this)"><i>文</i>Словарь</button></nav><div class="toast" id="toast"></div><script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $=id=>document.getElementById(id); const toast=t=>{let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)};
async function api(url,opt={}){let r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||'Ошибка');return r.json()}
async function boot(){try{let auth=await api('/api/auth',{method:'POST',body:JSON.stringify({initData:tg?.initData||''})});setUser(auth.user);await refresh()}catch(e){$('name').textContent='ученик';toast('Открой приложение из Telegram')}}
function setUser(u){$('name').textContent=u.first_name||'друг';$('avatar').textContent=(u.first_name||'中')[0].toUpperCase()}
async function refresh(){let m=await api('/api/me');$('total').textContent=m.total;$('dict-select').innerHTML=m.dictionaries.map(d=>`<option value="${d.id}" ${d.id===m.dictionary_id?'selected':''}>${esc(d.name)}${d.role==='owner'?' · владелец':''}</option>`).join('');$('channel-dictionary').innerHTML=m.dictionaries.filter(d=>d.role==='owner').map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');$('invite-button').classList.toggle('hidden',!m.dictionaries.some(d=>d.id===m.dictionary_id&&d.role==='owner'));await loadMembers(m.dictionary_id);await loadChannels();await loadReview()}
async function loadMembers(dictionary_id){try{let d=await api(`/api/dictionaries/${dictionary_id}/members`);$('member-list').innerHTML=d.members.map(m=>`<div class="card">${esc(m.first_name||m.username||String(m.telegram_id))} · ${m.role}${m.role==='member'?` <button class="link" onclick="removeMember(${dictionary_id},${m.telegram_id})">Убрать</button>`:''}</div>`).join('')}catch(e){$('member-list').innerHTML=''}}
async function removeMember(dictionary_id,telegram_id){try{await api('/api/dictionaries/members',{method:'DELETE',body:JSON.stringify({dictionary_id,telegram_id})});await loadMembers(dictionary_id);toast('Участник удалён')}catch(e){toast(e.message)}}
async function loadChannels(){try{let d=await api('/api/channels');$('channel-list').innerHTML=d.channels.length?d.channels.map(c=>`<div class="card">${esc(c.title||String(c.channel_id))} · ${esc(c.dictionary_name)} · ${c.enabled?'подключён':'отключён'} <button class="link" onclick="unlinkChannel(${c.channel_id},${c.dictionary_id})">Отключить</button></div>`).join(''):'<div class="translation">Каналы не подключены</div>'}catch(e){}}
async function linkChannel(){let channel_id=Number($('channel-id').value),dictionary_id=Number($('channel-dictionary').value);if(!Number.isInteger(channel_id)||!Number.isInteger(dictionary_id))return toast('Укажите ID канала и выберите словарь');try{await api('/api/channels/check',{method:'POST',body:JSON.stringify({channel_id})});await api('/api/channels/link',{method:'POST',body:JSON.stringify({channel_id,dictionary_id})});$('channel-id').value='';await loadChannels();toast('Канал подключён')}catch(e){toast(e.message)}}
async function unlinkChannel(channel_id,dictionary_id){try{await api('/api/channels/unlink',{method:'POST',body:JSON.stringify({channel_id,dictionary_id})});await loadChannels();toast('Канал отключён')}catch(e){toast(e.message)}}
async function selectDictionary(){try{await api('/api/dictionaries/select',{method:'POST',body:JSON.stringify({dictionary_id:Number($('dict-select').value)})});await refresh();toast('Словарь выбран')}catch(e){toast(e.message)}}
async function createDictionary(){let name=$('dict-name').value.trim();if(!name)return toast('Введите название');try{let d=await api('/api/dictionaries',{method:'POST',body:JSON.stringify({name})});await api('/api/dictionaries/select',{method:'POST',body:JSON.stringify({dictionary_id:d.dictionary_id})});$('dict-name').value='';await refresh();toast('Словарь создан')}catch(e){toast(e.message)}}
async function createInvite(){try{let d=await api('/api/dictionaries/invite',{method:'POST',body:JSON.stringify({dictionary_id:Number($('dict-select').value)})});$('invite-code').innerHTML=`<div class="card">Код приглашения: <b>${esc(d.code)}</b> · действует 7 дней</div>`}catch(e){toast(e.message)}}
async function redeemInvite(){let code=$('invite-code-input').value.trim();if(!code)return toast('Введите код');try{let d=await api('/api/dictionaries/redeem',{method:'POST',body:JSON.stringify({code})});await api('/api/dictionaries/select',{method:'POST',body:JSON.stringify({dictionary_id:d.dictionary_id})});$('invite-code-input').value='';await refresh();toast('Вы вступили в словарь')}catch(e){toast(e.message)}}
function card(w){return `<div class="card"><div class="word"><div class="hanzi">${esc(w.hanzi)}</div><div><div class="pinyin">${esc(w.pinyin)}</div><div class="translation">${esc(w.translation)}</div></div></div></div>`}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadReview(){try{let d=await api('/api/review');$('review').innerHTML=d.words.length?d.words.map(card).join(''):'<div class="card empty">Пока пусто. Добавь первое слово — и начнём.</div>'}catch(e){}}
async function addWord(e){e.preventDefault();try{let d=await api('/api/words',{method:'POST',body:JSON.stringify({hanzi:$('hanzi').value,pinyin:$('pinyin').value,translation:$('translation').value})});$('hanzi').value=$('pinyin').value=$('translation').value='';toast(d.created?'Слово добавлено':'Такое слово уже есть');await refresh();showTab('home',document.querySelector('[data-tab=home]'))}catch(e){toast(e.message)}}
async function loadWords(){try{let d=await api('/api/words');$('count').textContent=d.words.length+' слов';$('words').innerHTML=d.words.length?d.words.map(card).join(''):'<div class="card empty">Словарь пуст</div>'}catch(e){}}
function showTab(name,el){['home','add','dictionary'].forEach(x=>$(x).classList.toggle('hidden',x!==name));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');if(name==='dictionary')loadWords()}
boot();
</script></body></html>
