<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chinese Pocket</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--ink:#18212b;--muted:#718096;--line:#e6ebf0;--paper:#fbfaf7;--accent:#d9513f;--accent2:#f0a35b;--green:#2b8a65}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:24px 18px 100px}.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--accent);font-weight:800}.title{font-size:34px;letter-spacing:-.05em;line-height:1.05;margin:6px 0}.subtitle{color:var(--muted);margin:0}.avatar{width:44px;height:44px;border-radius:50%;background:#ffe2c6;display:grid;place-items:center;font-weight:800;color:#9b4f2f}.hero{background:linear-gradient(125deg,#242e38,#344b55);border-radius:24px;padding:23px;color:#fff;position:relative;overflow:hidden;margin-bottom:18px}.hero:after{content:'学';position:absolute;right:19px;bottom:-22px;font-size:130px;line-height:1;color:rgba(255,255,255,.1);font-family:serif}.hero h2{font-size:21px;margin:0 0 4px;position:relative;z-index:1}.hero p{color:#c8d3d8;margin:0;max-width:70%;position:relative;z-index:1}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.stat strong{font-size:28px;display:block;letter-spacing:-.04em}.stat span{font-size:12px;color:var(--muted)}section{margin:24px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section-head h3{margin:0;font-size:18px}.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}.word{display:flex;align-items:center;gap:14px}.hanzi{font-family:serif;font-size:32px;min-width:76px}.pinyin{font-weight:700}.translation{color:var(--muted);font-size:14px}.empty{text-align:center;color:var(--muted);padding:30px 10px}.form{display:grid;gap:10px}.form input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;background:#fff;outline:none}.form input:focus{border-color:var(--accent)}button.primary{border:0;border-radius:13px;background:var(--accent);color:#fff;padding:13px;font:inherit;font-weight:800;cursor:pointer}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:42px;padding:11px 18px calc(11px + env(safe-area-inset-bottom));z-index:5}.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;cursor:pointer}.tab.active{color:var(--accent)}.tab i{display:block;font-style:normal;font-size:21px;line-height:22px;margin-bottom:2px}.toast{position:fixed;left:18px;right:18px;bottom:84px;background:#23313b;color:#fff;border-radius:12px;padding:12px 15px;display:none;text-align:center}.hidden{display:none!important}@media(min-width:600px){main{padding-top:42px}.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><header class="top"><div><div class="eyebrow">Chinese Pocket · 中文</div><h1 class="title">Привет<span style="color:var(--accent)">, <b id="name">друг</b></span></h1><p class="subtitle">Твоя короткая ежедневная практика</p></div><div class="avatar" id="avatar">中</div></header><div class="hero"><h2>Маленькие шаги — большой прогресс</h2><p>Добавляй слова и возвращайся к ним каждый день.</p></div><div class="stats"><div class="stat"><strong id="total">0</strong><span>слов в словаре</span></div><div class="stat"><strong id="streak">1</strong><span>день подряд</span></div></div><section id="home"><div class="section-head"><h3>Повторить сегодня</h3><button class="link" onclick="loadReview()">Обновить</button></div><div id="review"></div></section><section id="add" class="hidden"><div class="section-head"><h3>Новое слово</h3></div><form class="form" onsubmit="addWord(event)"><input id="hanzi" placeholder="汉字 · иероглифы" required><input id="pinyin" placeholder="Pinyin · nǐ hǎo" required><input id="translation" placeholder="Перевод · привет" required><button class="primary">Добавить в словарь</button></form></section><section id="dictionary" class="hidden"><div class="section-head"><h3>Мой словарь</h3><span class="subtitle" id="count"></span></div><div id="words"></div></section></main><nav class="tabs"><button class="tab active" data-tab="home" onclick="showTab('home',this)"><i>⌂</i>Главная</button><button class="tab" data-tab="add" onclick="showTab('add',this)"><i>＋</i>Добавить</button><button class="tab" data-tab="dictionary" onclick="showTab('dictionary',this)"><i>文</i>Словарь</button></nav><div class="toast" id="toast"></div><script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $=id=>document.getElementById(id); const toast=t=>{let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)};
async function api(url,opt={}){let r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||'Ошибка');return r.json()}
async function boot(){try{let auth=await api('/api/auth',{method:'POST',body:JSON.stringify({initData:tg?.initData||''})});setUser(auth.user);await refresh()}catch(e){$('name').textContent='ученик';toast('Открой приложение из Telegram')}}
function setUser(u){$('name').textContent=u.first_name||'друг';$('avatar').textContent=(u.first_name||'中')[0].toUpperCase()}
async function refresh(){let m=await api('/api/me');$('total').textContent=m.total;await loadReview()}
function card(w){return `<div class="card"><div class="word"><div class="hanzi">${esc(w.hanzi)}</div><div><div class="pinyin">${esc(w.pinyin)}</div><div class="translation">${esc(w.translation)}</div></div></div></div>`}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadReview(){try{let d=await api('/api/review');$('review').innerHTML=d.words.length?d.words.map(card).join(''):'<div class="card empty">Пока пусто. Добавь первое слово — и начнём.</div>'}catch(e){}}
async function addWord(e){e.preventDefault();try{let d=await api('/api/words',{method:'POST',body:JSON.stringify({hanzi:$('hanzi').value,pinyin:$('pinyin').value,translation:$('translation').value})});$('hanzi').value=$('pinyin').value=$('translation').value='';toast(d.created?'Слово добавлено':'Такое слово уже есть');await refresh();showTab('home',document.querySelector('[data-tab=home]'))}catch(e){toast(e.message)}}
async function loadWords(){try{let d=await api('/api/words');$('count').textContent=d.words.length+' слов';$('words').innerHTML=d.words.length?d.words.map(card).join(''):'<div class="card empty">Словарь пуст</div>'}catch(e){}}
function showTab(name,el){['home','add','dictionary'].forEach(x=>$(x).classList.toggle('hidden',x!==name));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');if(name==='dictionary')loadWords()}
boot();
</script></body></html>
